<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kawaidoku">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffd6e4">
<title>Kawaidoku</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5b3550;--plum2:#7d4d6e;--ink:#4a2a40;
  --pink:#ff5d8f;--pink2:#ff8db0;--pink3:#ffd6e4;--gold:#ffc94d;--cream:#fff8fb;
  --g1:#ffd9e8;--g2:#ffeef6;--g3:#f3e6ff;--g4:#dff0ff;
  --card:rgba(255,255,255,.82);--solid:#fff;--modal1:#fff;--modal2:#fff8fb;--edge:#f0b9cd;--track:#f3dbe5;--inputbd:#f0c3d4;
  --lines:#5b3550;--boardbg:#f7e6ef;--lockbg:rgba(255,255,255,.4);--onbg:linear-gradient(180deg,#fff,#ffe1ec);--love:linear-gradient(135deg,#ffe0ec,#f1e6ff);
}
body.dark{
  --plum:#f6e8f8;--plum2:#cbb2d9;
  --g1:#1c1430;--g2:#2a1a3c;--g3:#36204a;--g4:#16203a;
  --card:rgba(62,42,82,.86);--solid:#3e2b52;--modal1:#46305c;--modal2:#352643;--edge:#140c1c;--track:#2a1d35;--inputbd:#5a4170;
  --lines:#1a0f22;--boardbg:#231830;--lockbg:rgba(255,255,255,.06);--onbg:linear-gradient(180deg,#5a3c70,#46305c);--love:linear-gradient(135deg,#4a2c55,#2f2a55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--plum);user-select:none;-webkit-user-select:none;
  background:linear-gradient(170deg,var(--g1),var(--g2) 30%,var(--g3) 62%,var(--g4));background-attachment:fixed;transition:color .3s}
@keyframes sky{to{background-position:100% 100%}}
button{font-family:inherit}

/* ---------- Décor ---------- */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;opacity:.85;animation:cloud linear infinite;will-change:transform}
body.dark .cloud{opacity:.1!important}
@keyframes cloud{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.twk{position:absolute;width:10px;height:10px;animation:twinkle 2.6s ease-in-out infinite}
.twk::before,.twk::after{content:'';position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.twk::before{width:100%;height:22%}.twk::after{width:22%;height:100%}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.deco{position:absolute;top:0;opacity:.55;animation:fall linear infinite;will-change:transform}
@keyframes fall{0%{transform:translate(0,-12vh) rotate(0)}50%{transform:translate(25px,48vh) rotate(150deg)}100%{transform:translate(-10px,112vh) rotate(320deg)}}
.snow{position:absolute;top:0;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.8);animation:fall linear infinite;will-change:transform}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:48}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 90px 10px rgba(255,40,90,.55);opacity:0}
#vig.on{animation:vig 1.1s ease-in-out infinite}
@keyframes vig{50%{opacity:1}}

/* ---------- Transition ---------- */
#wipe{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,#ff9cc0,#ff5d8f 70%,#e0457a);
  clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.7,0,.3,1);display:flex;align-items:center;justify-content:center}
#wipe.on{clip-path:circle(75% at 50% 50%);pointer-events:auto}
#wipe .wpet{width:120px;height:120px;transform:scale(0);transition:transform .3s .1s cubic-bezier(.3,1.8,.5,1)}
#wipe.on .wpet{transform:scale(1)}
#wipe{flex-direction:column;gap:14px}#wtxt{color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.15)}

/* ---------- Écrans ---------- */
.app{position:relative;z-index:1;height:100dvh;max-width:500px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
.screen.hidden{display:none}

/* ---------- Boutons ---------- */
.candy{position:relative;border:none;cursor:pointer;color:#fff;font-weight:700;border-radius:22px;
  background:linear-gradient(180deg,var(--a,#ff9cc0),var(--b,#ff5d8f));box-shadow:0 6px 0 var(--d,#c93a6a),0 12px 24px rgba(91,53,80,.22);
  transition:transform .12s,box-shadow .12s;overflow:hidden;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.candy::before{content:'';position:absolute;left:8%;right:8%;top:5px;height:38%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
.candy:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d,#c93a6a),0 4px 10px rgba(91,53,80,.2)}
.soft{position:relative;border:none;cursor:pointer;color:var(--plum);font-weight:600;background:var(--card);
  box-shadow:0 4px 0 rgba(91,53,80,.13),0 8px 18px rgba(91,53,80,.08);transition:transform .12s,box-shadow .12s}
.soft:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,53,80,.13)}
.berry{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:7px 13px;font-weight:700;font-size:15px}
.berry.bump{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.25)}}

/* ---------- Logo & mascotte ---------- */
.logo{text-align:center;position:relative}
.logo h1{margin:0;font-size:clamp(50px,15vw,70px);font-weight:700;line-height:1.05;letter-spacing:1px;
  filter:drop-shadow(0 3px 0 #ff5d8f) drop-shadow(0 4px 0 #5b3550) drop-shadow(0 10px 14px rgba(91,53,80,.3))}
.logo h1 span{display:inline-block;animation:wave 2.4s ease-in-out infinite;
  background:linear-gradient(180deg,#fff 0%,#fff 50%,#ffe0ec 51%,#ffc2d8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-5deg)}}
.logo p{margin:6px 0 0;font-weight:600;font-size:15px;color:var(--plum2)}
.bigpet{width:min(48vw,200px);aspect-ratio:1;position:relative}
.bigpet .petsvg{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite}
.bigpet::after{content:'';position:absolute;left:22%;right:22%;bottom:-4%;height:9%;border-radius:50%;background:rgba(91,53,80,.15);animation:shadow 2.6s ease-in-out infinite;z-index:-1}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes shadow{50%{transform:scaleX(.8);opacity:.6}}
.blink .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.petsvg{overflow:visible}
body.night #bg .twk{opacity:1}

/* ---------- Splash ---------- */
#splash{align-items:center;justify-content:center;gap:18px;cursor:pointer}
.tapgo{font-weight:700;font-size:18px;color:#fff;background:linear-gradient(180deg,#ff9cc0,#ff5d8f);padding:12px 26px;border-radius:99px;
  box-shadow:0 6px 0 #c93a6a,0 12px 24px rgba(255,93,143,.35);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- Menu ---------- */
#menu{align-items:center;justify-content:space-between;gap:7px;overflow-y:auto}
.mtopbar{width:100%;display:flex;align-items:center;justify-content:space-between}
.mtopbar .rt{display:flex;gap:7px}
.iconbtn{width:44px;height:44px;border-radius:15px;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#menu .logo h1{font-size:clamp(38px,11vw,50px)}
#menu .logo p{font-size:14px;margin-top:2px}
.picker{display:flex;align-items:center;gap:10px}
.picker .bigpet{width:min(30vw,120px)}
.arrow{width:40px;height:40px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
.petname{text-align:center;font-weight:700;font-size:16px;margin-top:-2px}
.petname small{display:block;font-weight:600;font-size:12px;opacity:.7}
.adv{width:100%;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.adv::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite;will-change:transform}
@keyframes shine{0%,55%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(560%) skewX(-20deg)}}
.adv .big{font-size:26px;line-height:1.05}
.adv .sub{font-size:13.5px;font-weight:600;opacity:.95}
.adv .go{font-size:28px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;padding-left:4px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.row3 .soft{border-radius:18px;padding:9px 4px;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.row3 b{font-size:22px;line-height:1.1}
.sect{width:100%;font-weight:700;font-size:12.5px;color:var(--plum2);display:flex;align-items:center;gap:8px;margin-bottom:-2px;letter-spacing:.5px;text-transform:uppercase}
.sect::after{content:'';flex:1;height:2px;background:rgba(125,77,110,.16);border-radius:2px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%}
.diff{border-radius:16px;padding:8px 2px 7px;text-align:center;box-shadow:0 4px 0 var(--c2),0 8px 16px rgba(91,53,80,.08)}
.diff:active{box-shadow:0 1px 0 var(--c2)}
.diff .size{font-size:17px;font-weight:700}
.diff .name{font-size:10.5px;font-weight:600;opacity:.75}
.diff .best{display:block;font-size:10px;font-weight:600;background:var(--c3);color:#5b3550;border-radius:99px;margin:3px 4px 0;padding:1px 0}
.stats{font-size:12.5px;font-weight:600;color:var(--plum2);opacity:.85;min-height:16px;text-align:center}

/* ---------- Niveaux / Boutique ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h3{margin:0;font-size:24px}
#levels,#shop{gap:10px}
.scroll{flex:1;overflow-y:auto;padding:4px 4px 30px;-webkit-overflow-scrolling:touch}
.band{margin-bottom:18px}
.bandhead{display:flex;align-items:center;justify-content:space-between;border-radius:18px;padding:10px 14px;margin-bottom:10px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 rgba(91,53,80,.15);text-shadow:0 1px 0 rgba(0,0,0,.15)}
.bandhead small{font-weight:600;opacity:.95}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;border:none;border-radius:18px;font-weight:700;font-size:19px;color:var(--plum);background:var(--solid);cursor:pointer;
  box-shadow:0 4px 0 var(--c2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c2)}
.lv .st{font-size:8.5px;letter-spacing:-1px;line-height:1}
.lv.locked{background:var(--lockbg);color:var(--plum2);opacity:.5;box-shadow:none;cursor:default;font-size:15px}
.lv.cur{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;animation:pulse 1.2s infinite}
.tabs{display:flex;gap:7px}
.tab{flex:1;border-radius:15px;padding:9px 4px;font-size:14px}
.tab.sel{background:linear-gradient(180deg,#ff9cc0,#ff5d8f);color:#fff;box-shadow:0 4px 0 #c93a6a}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-content:start}
.item{border-radius:22px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default}
.item:active{transform:none}
.item.sel{box-shadow:0 0 0 3px var(--pink),0 4px 0 rgba(91,53,80,.13)}
.item .pv{width:90px;height:90px;display:flex;align-items:center;justify-content:center}
.item .pv .petsvg{width:100%;height:100%}
.item .nm{font-weight:700;font-size:14px;text-align:center;line-height:1.15;min-height:32px;display:flex;align-items:center}
.item button{width:100%;border-radius:14px;padding:9px 4px;font-size:14px}
.item .eq{background:var(--track);color:var(--plum2);box-shadow:none}
.tab{font-size:12.5px;padding:9px 2px}
.item{position:relative}
.item .rar{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:700;color:#fff;padding:2px 7px;border-radius:99px;background:var(--rc);letter-spacing:.3px;z-index:2}
.item .slot{position:absolute;top:8px;right:9px;font-size:10px;font-weight:600;opacity:.6}
.item.leg{background:linear-gradient(160deg,rgba(255,236,170,.95),var(--card) 60%);overflow:hidden}
.item.leg::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite;pointer-events:none}
.item.locked .pv{filter:saturate(.85)}
.item .fxico{font-size:52px;animation:bob 2.2s ease-in-out infinite;cursor:pointer}
.mbox{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;text-align:left;--a:#ffd36b;--b:#ffa94d;--d:#d9822b}
.mbox .gift{font-size:38px;animation:wig 1.6s ease-in-out infinite;display:inline-block}
.mbox b{display:block;font-size:19px}.mbox small{font-size:12.5px;font-weight:600;opacity:.95}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{border-radius:99px;padding:6px 12px;font-size:13px}
.chip.sel{background:var(--plum);color:var(--g2)}
.coll{font-size:12.5px;font-weight:600;color:var(--plum2);margin:0 2px 10px;display:flex;align-items:center;gap:8px}
.coll .bar{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.coll .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd36b,#ff8db0,#b98cff);border-radius:99px}
.giftbig{font-size:110px;line-height:1.1;display:inline-block;animation:shakebox .12s linear infinite}
@keyframes shakebox{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg) scale(1)}}
.reveal{animation:revealIn .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes revealIn{from{transform:scale(0) rotate(-30deg)}}
.rartag{display:inline-block;color:#fff;font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px;margin:4px 0 6px}
.row2b{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;width:100%}
.big2{position:relative;border-radius:18px;padding:9px 12px;display:flex;align-items:center;gap:9px;text-align:left;font-size:14.5px;font-weight:700}
.big2 b{font-size:28px;line-height:1}.big2 small{display:block;font-size:11.5px;opacity:.75;font-weight:600}
.notif{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ff4d6d;border:2.5px solid #fff;animation:pulse 1s infinite}
#buddy{position:absolute;left:50%;top:-52px;width:62px;height:62px;margin-left:-31px;z-index:6;cursor:pointer}
#buddy .bp{width:100%;height:100%}#buddy .petsvg{width:100%;height:100%}
#buddy.idle .petsvg{animation:bob 2.4s ease-in-out infinite}
#buddy.happy .petsvg{animation:jump .7s cubic-bezier(.3,1.5,.5,1)}
#buddy.dance .petsvg{animation:dance .45s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(-9px)}}
#buddy.scared .petsvg{animation:tremble .12s linear infinite}
@keyframes tremble{0%{transform:translate(-1.5px,0)}50%{transform:translate(1.5px,1px)}100%{transform:translate(-1.5px,0)}}
#buddy.sad .petsvg{animation:bshake .5s}
#buddy.sleep .petsvg{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,.94) translateY(4%)}}
#buddy.party .petsvg{animation:jump .65s infinite}
.bubble{position:absolute;left:calc(100% + 8px);top:6px;white-space:nowrap;background:var(--solid);color:var(--plum);font-weight:700;font-size:13px;padding:5px 11px;border-radius:14px;
  box-shadow:0 3px 0 rgba(91,53,80,.13);opacity:0;transform:scale(.4);transform-origin:left center;transition:.28s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::before{content:'';position:absolute;left:-6px;top:9px;border:6px solid transparent;border-right-color:var(--solid);border-left:0}
.zzz{position:absolute;right:-8px;top:-8px;font-weight:700;color:var(--plum2);font-size:15px;opacity:0;pointer-events:none}
#buddy.sleep .zzz{animation:zzz 2s infinite}
@keyframes zzz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(12px,-22px) scale(1.15);opacity:0}}
.wheelwrap{position:relative;width:min(270px,70vw);aspect-ratio:1;margin:8px auto 14px}
.wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.82,.18,1);filter:drop-shadow(0 6px 0 rgba(91,53,80,.2))}
.pointer{position:absolute;left:50%;top:-12px;margin-left:-15px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid #ff4d6d;filter:drop-shadow(0 3px 0 #5b3550);z-index:2}
.hub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#fff;border:4px solid #5b3550;display:flex;align-items:center;justify-content:center;z-index:2;overflow:hidden}
.hub .petsvg{width:90%;height:90%}
.wheelwrap.lights::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:6px dotted #ffd43b;animation:spin 6s linear infinite}
.streak{display:inline-block;font-weight:700;font-size:15px;background:linear-gradient(180deg,#ffb36b,#ff6b4a);color:#fff;padding:4px 14px;border-radius:99px;margin:2px 0 8px;box-shadow:0 3px 0 #c9452a}
#who{align-items:center;justify-content:center;gap:16px}
#who h2{margin:0;font-size:30px;color:var(--pink);text-shadow:0 3px 0 rgba(255,93,143,.2)}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.whocard{border-radius:26px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.whopet{width:110px;height:110px}.whopet .petsvg{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
.whocard:nth-child(2) .petsvg{animation-delay:-1.2s}
.whoname{font-size:22px;font-weight:700}.whost{font-size:12px;font-weight:600;opacity:.75}
.subbtn{cursor:pointer}.subbtn small{opacity:.7;font-size:12px;text-decoration:underline}
.paper{background:#fffdf6;color:#5b3550;border-radius:14px;padding:16px 16px 12px;margin:8px 0 14px;text-align:left;box-shadow:0 4px 0 #f0d9c0,0 10px 20px rgba(91,53,80,.12);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,141,176,.25) 27px 28px);transform:rotate(-1deg);animation:revealIn .5s cubic-bezier(.2,1.6,.4,1)}
.ptitle{font-weight:700;font-size:13px;color:#e3628d;margin-bottom:4px}.ptitle:empty{display:none}
.ptext{font-family:'Caveat',cursive;font-size:25px;line-height:28px}
.psign{font-family:'Caveat',cursive;font-size:22px;text-align:right;margin-top:6px;color:#e3628d}
.env{font-size:64px;animation:revealIn .5s cubic-bezier(.2,1.6,.4,1)}
.maillist{display:grid;gap:8px;margin:10px 0 14px}
.mailrow{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 14px;font-size:15px;text-align:left}
.mailrow span{flex:1}.mailrow span small{opacity:.65}
.mdel{font-style:normal;font-size:17px;padding:4px 2px 4px 10px;cursor:pointer;opacity:.75}.mailrow small{font-size:11.5px;opacity:.7}.mailrow.locked{opacity:.55;cursor:default}
.pindots{display:flex;justify-content:center;gap:14px;margin:12px 0 16px}
.pindots i{width:16px;height:16px;border-radius:50%;background:var(--track);transition:.2s}.pindots i.on{background:var(--pink);transform:scale(1.2)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{border-radius:18px;padding:14px 0;font-size:22px;font-weight:700}
#admin{gap:10px}
.atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.atab{border-radius:99px;padding:8px 12px;font-size:13px;white-space:nowrap}
.atab.sel{background:linear-gradient(180deg,#ff9cc0,#ff5d8f);color:#fff;box-shadow:0 4px 0 #c93a6a}
#admBody{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 4px 0 rgba(91,53,80,.1)}
#admBody .field small{font-weight:500;opacity:.7}
.field select,.arow select,.arow input{width:100%;margin-top:4px;border:2px solid var(--inputbd);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--plum);background:var(--solid);outline:none}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-weight:700}.arow select{flex:1}
.abtn{width:100%;border-radius:16px;padding:13px;font-size:16px;margin:4px 0 10px}
.alist{display:grid;gap:8px;margin:6px 0 12px}
.aitem{position:relative;background:var(--solid);border-radius:14px;padding:10px 40px 10px 12px;font-size:13.5px;text-align:left}
.aitem b{display:block;font-size:12.5px;color:var(--plum2)}.aitem span{white-space:pre-wrap}
.aitem button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:18px;cursor:pointer}
.astat{font-size:12.5px;font-weight:600;background:#fff3c4;color:#7a5a00;border-radius:12px;padding:8px 10px;margin-bottom:12px}
.astat.ok{background:#d7f7e9;color:#1f6b4a}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.agrid button{border-radius:16px;padding:14px 6px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#5b3550;color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;z-index:90;max-width:90vw;text-align:center;animation:revealIn .35s}
.notifban{width:100%;display:flex;align-items:center;gap:8px;border-radius:18px;padding:9px 10px 9px 12px;font-size:13px;font-weight:600;text-align:left;animation:revealIn .5s}
.notifban b{font-size:22px;animation:wobble 1.2s ease-in-out infinite}.notifban span{flex:1}
.notifban .candy{font-size:14px;border-radius:14px;padding:8px 12px}.notifban .nb{border:none;background:none;color:var(--plum2);font:600 12px inherit;font-family:inherit;cursor:pointer;padding:4px}
.scream{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:shakebox .08s linear infinite}
.scream .sface{width:120vw;max-width:700px;animation:zoomin .25s cubic-bezier(.2,1.8,.4,1) forwards;filter:contrast(1.3) saturate(1.6) drop-shadow(0 0 40px red)}
.scream .stxt{position:absolute;bottom:12vh;font-size:72px;font-weight:700;color:#ff1a3c;text-shadow:0 0 20px #f00}
.scream.out{opacity:0;transition:opacity .35s}
@keyframes zoomin{from{transform:scale(.05)}to{transform:scale(1.15)}}
.app.flip{transform:rotate(180deg);transition:transform .8s cubic-bezier(.3,1.4,.5,1)}.app{transition:transform .8s}
.suivi{background:var(--solid);border-radius:20px;padding:12px;margin-bottom:12px}
.suivi .sh{display:flex;align-items:center;gap:10px;margin-bottom:6px;text-align:left}.suivi .sh b{font-size:19px}.suivi .sh small{display:block;font-size:12px;opacity:.7}
.suivi .sp{width:54px;height:54px}.suivi .sp .petsvg{width:100%;height:100%}
.suivi .statgrid{margin:6px 0 0}.suivi .statgrid div{background:var(--card)}
.trolls{display:grid;gap:9px;margin:4px 0 14px}
.troll{display:flex;align-items:center;gap:10px;border-radius:18px;padding:10px;text-align:left}
.troll .ti{font-size:30px}.troll .tt{flex:1}.troll .tt b{display:block;font-size:14.5px}.troll .tt small{font-size:11.5px;opacity:.75}
.troll .tb{display:flex;flex-direction:column;gap:5px}.troll .tb button{border-radius:12px;padding:6px 10px;font-size:12.5px}
.tov{position:fixed;inset:0;z-index:95;pointer-events:none}
.quake{animation:bshake .18s linear infinite}
html.disco{animation:disco .46s linear infinite}@keyframes disco{to{filter:hue-rotate(360deg) saturate(1.8)}}
.call{pointer-events:auto;background:linear-gradient(180deg,#2b2140,#120c1c);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:14vh;gap:6px;animation:revealIn .4s}
.call .cn{font-size:34px;font-weight:700}.call .cs{opacity:.75;font-size:17px}.call .cp{width:150px;height:150px;margin:6vh 0;animation:bob 1.2s infinite}.call .cp .petsvg{width:100%;height:100%}
.call .cb{display:flex;gap:80px;margin-top:auto;margin-bottom:12vh}.call .cb button{width:74px;height:74px;border-radius:50%;border:none;font-size:32px;color:#fff;cursor:pointer}
.call .cr{background:#ff3b30}.call .ca{background:#34c759;animation:pulse 1s infinite}.call .cmsg{font-size:22px;font-weight:700}
.vir{pointer-events:auto;background:rgba(80,0,0,.35)}.vir .vb{position:absolute;top:8vh;left:50%;transform:translateX(-50%);background:#e3002a;color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;font-size:18px;white-space:nowrap;animation:pulse .4s infinite}
.vir i{position:absolute;font-style:normal;animation:revealIn .3s}
.vir .vclean{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.9);color:var(--plum)}.vir .vclean .petsvg{width:140px;height:140px}.vir .vclean b{font-size:22px}
.kiss{pointer-events:auto}.kiss i{position:absolute;font-style:normal;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;animation:revealIn .35s backwards}.kiss i b{display:block;line-height:1}
.ghost{background:rgba(0,0,0,.65);animation:fade 5.2s reverse}.ghost i{position:absolute;top:30vh;font-style:normal;font-size:180px;opacity:.85;animation:ghost 5s ease-in-out forwards}
@keyframes ghost{0%{left:-200px;transform:scale(.8)}50%{transform:scale(1.4) translateY(-30px)}100%{left:110vw;transform:scale(.8)}}
.fly{pointer-events:auto;font-size:40px;width:60px;height:60px;inset:auto;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .25s linear;cursor:pointer;z-index:96}.fly b{line-height:1}.flycatch{pointer-events:auto;z-index:94}
body.lite .twk,body.lite .cloud{display:none}body.lite .bw{animation:none}body.lite .hearts svg{animation:none}
body.bgpause *{animation-play-state:paused!important}
.swatch{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:80px;height:80px;padding:4px;background:#5b3550;border-radius:16px;box-shadow:0 4px 0 rgba(91,53,80,.15)}
.swatch i{border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}

/* ---------- Jeu ---------- */
#game{gap:10px}
.hearts{display:flex;gap:3px}
.hearts svg{width:36px;height:36px;animation:beat 1.4s ease-in-out infinite}
.hearts svg:nth-child(2){animation-delay:.12s}.hearts svg:nth-child(3){animation-delay:.24s}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%{transform:scale(1.14)}20%{transform:scale(1)}30%{transform:scale(1.08)}}
.hearts svg.lost{animation:heartbreak .8s forwards}
.hearts svg.gone{filter:grayscale(1) opacity(.28);transform:scale(.78);animation:none}
@keyframes heartbreak{0%{transform:scale(1)}15%{transform:scale(1.6) rotate(-12deg)}35%{transform:scale(1.35) rotate(12deg)}55%{transform:scale(1.2) rotate(-6deg)}100%{transform:scale(.78);filter:grayscale(1) opacity(.28)}}
.infobar{display:flex;align-items:center;gap:8px;border-radius:18px;padding:9px 12px;font-weight:600;font-size:15px;cursor:default}
.infobar:active{transform:none}
.prog{flex:1;height:14px;background:var(--track);border-radius:99px;overflow:hidden;position:relative;box-shadow:inset 0 2px 3px rgba(91,53,80,.12)}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;transition:width .6s cubic-bezier(.3,1.5,.5,1);
  background:linear-gradient(90deg,#ff9cc0,#ff5d8f,#b98cff);}
.prog i::after{content:'';position:absolute;left:4px;right:4px;top:2px;height:4px;border-radius:99px;background:rgba(255,255,255,.55)}
@keyframes flow{to{background-position:-200% 0}}
.tm{font-variant-numeric:tabular-nums;white-space:nowrap}.cnt{white-space:nowrap}
.boardzone{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.frame{position:relative;padding:10px;border-radius:30px;background:linear-gradient(160deg,var(--modal1),var(--modal2));
  box-shadow:0 9px 0 var(--edge),0 22px 44px rgba(255,93,143,.22)}
.frame .corner{position:absolute;width:30px;height:30px;z-index:3;pointer-events:none;animation:wig 3s ease-in-out infinite;font-size:26px;line-height:30px;text-align:center}
.frame .corner svg{width:100%;height:100%}
.frame .c1{left:-10px;top:-12px}.frame .c2{right:-10px;top:-12px;animation-delay:-1s}
.frame .c3{left:-10px;bottom:-8px;animation-delay:-2s}.frame .c4{right:-10px;bottom:-8px;animation-delay:-1.5s}
@keyframes wig{50%{transform:rotate(14deg) scale(1.1)}}
.frame.shake{animation:bshake .45s}
.frame.punch{animation:punch .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes punch{40%{transform:scale(1.025)}}
@keyframes bshake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,2px) rotate(-1.2deg)}40%{transform:translate(8px,-2px) rotate(1.2deg)}60%{transform:translate(-5px,1px)}80%{transform:translate(3px,0)}}
#board{position:relative;display:grid;width:min(calc(100vw - 60px),calc(100dvh - 390px),450px);aspect-ratio:1;background:var(--boardbg);
  border-radius:20px;padding:3px;touch-action:none;transition:filter .8s;box-shadow:inset 0 2px 5px rgba(91,53,80,.15)}
#board.dead{filter:grayscale(.85) brightness(.92)}
#board.intro .cell{animation:tilein .55s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes tilein{from{transform:scale(0) rotate(-20deg);opacity:0}}
.cell{position:relative;cursor:pointer;contain:layout style}
.tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35) 1.4px,transparent 1.6px),linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%,rgba(91,53,80,.06));
  background-size:12px 12px,100% 100%;
  border-radius:24%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3.5px 0 rgba(60,20,50,.16),0 2px 3px rgba(91,53,80,.18);
  transition:transform .12s,filter .12s,background-color .5s}
body.dark .tile{filter:brightness(.9) saturate(.95)}
.cell.press .tile{transform:scale(.88);filter:brightness(.93)}
.cell.hold .tile{animation:hold .38s linear forwards}
@keyframes hold{to{transform:scale(.8);filter:brightness(1.1)}}
.tile .x{width:38%;height:38%;animation:xin .32s cubic-bezier(.3,1.9,.5,1) backwards}
@keyframes xin{from{transform:scale(0) rotate(-120deg);opacity:0}}
.bw{position:relative;width:88%;height:88%;animation:idle 2.4s ease-in-out infinite;will-change:transform}
.bw::after{content:'';position:absolute;left:18%;right:18%;bottom:0;height:12%;border-radius:50%;background:rgba(91,53,80,.2);z-index:-1}
.bw svg{width:100%;height:100%;display:block;animation:drop .55s cubic-bezier(.25,1.6,.45,1)}
@keyframes drop{0%{transform:translateY(-140%) scale(.6);opacity:0}45%{transform:translateY(0) scale(1.3,.72);opacity:1}70%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96) translateY(2%)}}
.bw.jump{animation:jump .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes jump{0%{transform:scale(1)}20%{transform:scale(1.25,.75)}50%{transform:translateY(-50%) scale(.88,1.15) rotate(-10deg)}80%{transform:scale(1.18,.82)}100%{transform:scale(1)}}
.tile.wrong::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(255,40,80,.6);animation:fade .65s forwards}
@keyframes fade{to{opacity:0}}
.tile.glow{animation:glow .7s ease-out}
@keyframes glow{35%{filter:brightness(1.2) saturate(1.25);box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),inset 0 3px 0 rgba(255,255,255,.45)}}
.tile.hint{animation:hintglow 1s ease-in-out 3;z-index:2}
@keyframes hintglow{50%{box-shadow:inset 0 0 0 4px #fff,0 0 24px 8px #fff;transform:scale(1.1)}}
.tile.won{animation:gold .7s forwards}
@keyframes gold{0%{transform:rotateY(0)}49%{transform:rotateY(90deg)}50%{transform:rotateY(90deg);background:linear-gradient(160deg,#fff4c4,#ffd36b)}100%{transform:rotateY(0);background:linear-gradient(160deg,#fff4c4,#ffd36b)}}
.beam{position:absolute;overflow:hidden;pointer-events:none;border-radius:10px;z-index:4}
.beam i{position:absolute;inset:0;animation:sweep .6s ease-out forwards}
.beam.h i{background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);background-size:40% 100%;background-repeat:no-repeat}
.beam.v i{background:linear-gradient(180deg,transparent,rgba(255,255,255,.9),transparent);background-size:100% 40%;background-repeat:no-repeat}
@keyframes sweep{0%{background-position:-60% -60%;opacity:1}100%{background-position:160% 160%;opacity:.2}}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--card);border-radius:28px;padding:10px 6px 8px;
  box-shadow:0 6px 0 rgba(91,53,80,.1),0 14px 30px rgba(91,53,80,.12),inset 0 1px 0 rgba(255,255,255,.6)}
.act{border:none;background:none;cursor:pointer;padding:0;font-size:11px;font-weight:700;color:var(--plum2);display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit}
.act .ic{position:relative;width:50px;height:50px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--a),var(--b));box-shadow:0 4px 0 var(--d),0 7px 12px rgba(91,53,80,.15);transition:transform .12s,box-shadow .12s,filter .2s;overflow:hidden}
.act .ic::before{content:'';position:absolute;left:12%;right:12%;top:4px;height:38%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
.act .ic svg{width:26px;height:26px;position:relative;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.18))}
.act:active .ic{transform:translateY(4px) scale(.96);box-shadow:0 0 0 var(--d)}
.act.offb .ic{filter:grayscale(1) brightness(1.05);opacity:.6}
.act.on .ic{animation:glowpulse 2.4s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 4px 0 var(--d),0 0 16px 3px rgba(255,141,176,.6)}}
#tod{position:fixed;inset:0;pointer-events:none;z-index:0;transition:background 2s}
#wx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drop{position:absolute;top:-20px;width:2px;height:16px;border-radius:2px;background:linear-gradient(180deg,rgba(140,190,255,0),rgba(120,170,240,.7));animation:rain linear infinite}
@keyframes rain{to{transform:translate(-40px,115vh)}}
.rainbow{position:absolute;left:50%;top:6vh;width:150vw;max-width:900px;transform:translateX(-50%);opacity:0;animation:rbIn 3s forwards}
@keyframes rbIn{to{opacity:.55}}
.shoot{position:fixed;z-index:30;width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 70%,#fff6c2);box-shadow:0 0 12px #fff6c2;
  transform-origin:right center;pointer-events:auto;cursor:pointer;animation:shoot 1.6s linear forwards}
.shoot::after{content:'⭐';position:absolute;right:-12px;top:-11px;font-size:20px}
@keyframes shoot{0%{transform:translate(0,0) rotate(-30deg);opacity:0}10%{opacity:1}100%{transform:translate(-120vw,60vh) rotate(-30deg);opacity:0}}
body.night .cloud{opacity:.25!important}
.eggpill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:7px 11px;font-weight:700;font-size:14px}
.eggpill.ready{animation:wobble 1s ease-in-out infinite;background:linear-gradient(180deg,#fff3c4,#ffd36b);color:#5b3550}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.lt{display:flex;gap:6px}
.eggbig{width:150px;height:170px;margin:4px auto 6px;cursor:pointer}
.eggbig svg{width:100%;height:100%}
.eggbig.shake{animation:shakebox .12s linear infinite}
.eggbig.tap{animation:eggtap .25s}
@keyframes eggtap{40%{transform:scale(1.1,.9) rotate(-6deg)}}
.flash{position:fixed;inset:0;background:#fff;z-index:80;pointer-events:none;animation:flash 1s forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.statgrid div{background:var(--solid);border-radius:16px;padding:9px 6px;font-size:12px;font-weight:600;color:var(--plum2);box-shadow:0 2px 0 rgba(91,53,80,.08)}
.statgrid b{display:block;font-size:21px;color:var(--plum);margin-top:1px}
.statgrid .ico{font-size:18px}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:12px}
.sizes div{background:var(--solid);border-radius:12px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--plum2)}
.sizes b{display:block;font-size:13px;color:var(--plum)}
.mara{width:100%;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left;--a:#c9a8ff;--b:#9466e0;--d:#6a3fb8;margin-top:-2px}
.mara .big{font-size:21px;line-height:1.05}
.mara .go{font-size:24px}


/* ---------- Textes flottants ---------- */
.float{position:fixed;z-index:49;pointer-events:none;transform:translate(-50%,-50%);font-weight:700;font-size:24px;white-space:nowrap;
  -webkit-text-stroke:6px #fff;paint-order:stroke fill;animation:floatup 1.15s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes floatup{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}25%{transform:translate(-50%,-90%) scale(1.18);opacity:1}100%{transform:translate(-50%,-230%) scale(1);opacity:0}}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(40,20,40,.42);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{position:relative;width:100%;max-width:350px;max-height:calc(100dvh - 90px);overflow-y:auto;background:linear-gradient(180deg,var(--modal1),var(--modal2));border-radius:32px;padding:24px 20px 18px;text-align:center;
  box-shadow:0 10px 0 var(--edge),0 30px 60px rgba(40,20,40,.35);transform:scale(.5) translateY(80px);transition:transform .55s cubic-bezier(.2,1.6,.4,1)}
.modal.nopet{padding-top:20px}
.overlay.show .modal{transform:scale(1)}
.mtop{position:relative;width:120px;height:120px;margin:-6px auto -6px}
.mtop .petsvg{position:relative;width:100%;height:100%;animation:bob 2.2s ease-in-out infinite;z-index:1}
.rays{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,201,77,.45) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal h2{margin:6px 0 2px;font-size:32px;color:var(--pink);text-shadow:0 3px 0 rgba(255,93,143,.2)}
.modal h2 span{display:inline-block;animation:letter .5s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes letter{from{transform:translateY(-30px) scale(0);opacity:0}}
.lvdone{font-weight:700;color:var(--plum2);font-size:15px}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 8px}
.stars svg{width:46px;height:46px;opacity:0;animation:starin .55s cubic-bezier(.3,1.8,.5,1) forwards}
.stars span:nth-child(2) svg{width:54px;height:54px;margin-top:-6px}
@keyframes starin{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:scale(1);opacity:1}}
.reward{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:20px;color:#e0457a;background:var(--solid);border-radius:99px;padding:4px 16px;margin-bottom:10px;box-shadow:0 3px 0 rgba(91,53,80,.1);animation:pulse 1s infinite}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mstats div{background:var(--solid);border-radius:14px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--plum2);box-shadow:0 2px 0 rgba(91,53,80,.08)}
.mstats b{display:block;font-size:19px;color:var(--plum);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:linear-gradient(180deg,#ffe08a,#ffc94d);color:#5b3550;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:8px;animation:pulse 1s infinite;box-shadow:0 3px 0 #d9a52a}
.love{background:var(--love);border-radius:16px;padding:10px 12px;margin:0 0 12px;font-weight:600;font-size:15px;line-height:1.35}
.mbtns{display:flex;gap:8px}
.mbtns button{flex:1;border-radius:18px;padding:13px 6px;font-size:16px}
.field{display:block;text-align:left;font-weight:600;font-size:14px;margin:0 0 10px}
.field input,.field textarea{width:100%;margin-top:4px;border:2px solid var(--inputbd);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--plum);background:var(--solid);outline:none;resize:none}

.small{font-size:12.5px;color:var(--plum2);opacity:.85;margin:-4px 0 12px}
.rules{text-align:left;font-size:14.5px;line-height:1.45;margin:4px 0 14px;padding-left:20px}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;font-weight:600;font-size:15px;text-align:left;border-bottom:1.5px solid rgba(125,77,110,.12)}
.setrow small{display:block;font-size:12px;font-weight:500;opacity:.7}
.sw{width:48px;height:28px;border-radius:99px;background:#d9c3cf;position:relative;transition:.2s;flex-shrink:0;cursor:pointer;border:none}
body.dark .sw{background:#5a4170}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 3px rgba(0,0,0,.2)}
.sw.on,body.dark .sw.on{background:var(--pink)}.sw.on::after{left:23px}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.th{border-radius:16px;padding:11px 6px;font-size:14px;line-height:1.2}
.th small{display:block;font-size:11px;font-weight:500;opacity:.75}
.th.sel{box-shadow:0 0 0 3px var(--pink),0 4px 0 rgba(91,53,80,.13)}
.th.wide{grid-column:1/-1}

/* =========================================================
   Générateur (solution unique) + niveaux infinis
   ========================================================= */
function randomPerm(n){const p=[],used=Array(n).fill(false);
  (function bt(r){if(r===n)return true;for(const c of shuffle([...Array(n).keys()])){if(used[c]||(r&&Math.abs(c-p[r-1])<2))continue;used[c]=true;p[r]=c;if(bt(r+1))return true;used[c]=false}return false})(0);return p}
function growRegions(n,sol){const g=Array.from({length:n},()=>Array(n).fill(-1));for(let r=0;r<n;r++)g[r][sol[r]]=r;let left=n*n-n;const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(left>0){const id=rnd(n),front=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]===id)for(const[dr,dc]of D){const a=r+dr,b=c+dc;if(a>=0&&b>=0&&a<n&&b<n&&g[a][b]===-1)front.push([a,b])}
    if(!front.length)continue;const[a,b]=pick(front);g[a][b]=id;left--}return g}
let NODES=0;
function solve(n,g,limit=2){const out=[],p=[],cu=Array(n).fill(false),ru=Array(n).fill(false);
  (function bt(r){NODES++;if(out.length>=limit)return;if(r===n){out.push([...p]);return}
    for(let c=0;c<n;c++){if(cu[c]||ru[g[r][c]]||(r&&Math.abs(c-p[r-1])<2))continue;cu[c]=ru[g[r][c]]=true;p[r]=c;bt(r+1);cu[c]=ru[g[r][c]]=false}})(0);return out}
function connected(n,g,id){let st=null,tot=0;for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]===id){tot++;st=st||[r,c]}if(!st)return false;
  const seen=new Set([st+'']),q=[st];while(q.length){const[r,c]=q.pop();for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=r+dr,b=c+dc,k=a+','+b;
    if(a>=0&&b>=0&&a<n&&b<n&&g[a][b]===id&&!seen.has(k)){seen.add(k);q.push([a,b])}}}return seen.size===tot}
function generate(n){for(let att=0;att<80;att++){const sol=randomPerm(n),g=growRegions(n,sol);
  for(let it=0;it<150;it++){const sols=solve(n,g,2);if(sols.length===1)return{n,g,sol};const alt=sols.find(s=>s.some((c,r)=>c!==sol[r]));let ch=false;
    for(const r of shuffle([...Array(n).keys()]).filter(r=>alt[r]!==sol[r])){const c=alt[r],old=g[r][c];
      const nb=shuffle([[1,0],[-1,0],[0,1],[0,-1]].map(([dr,dc])=>[r+dr,c+dc]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&g[a][b]!==old).map(([a,b])=>g[a][b]));
      for(const id of nb){g[r][c]=id;if(connected(n,g,old)){ch=true;break}g[r][c]=old}if(ch)break}if(!ch)break}}return null}

  {a:1, b:8,  n:5,name:'Prairie fleurie',  c1:'#7fe0b5',c2:'#4fbf8f'},{a:9, b:25, n:6,name:'Verger aux fraises',c1:'#7cc4ff',c2:'#4c9fe0'},

function curStreak(){const l=LS.get('dLast','');return l===dayKey()||l===yesterday()?LS.get('streak',0):0}

function wheelSVG(){const N=PRIZES.length,A=360/N;let g='';
  PRIZES.forEach((p,i)=>{const a0=(i*A-90)*Math.PI/180,a1=((i+1)*A-90)*Math.PI/180,x0=50+48*Math.cos(a0),y0=50+48*Math.sin(a0),x1=50+48*Math.cos(a1),y1=50+48*Math.sin(a1);
    g+=`<path d="M50 50 L${x0} ${y0} A48 48 0 0 1 ${x1} ${y1}Z" fill="${p.c}" stroke="#5b3550" stroke-width="1.2"/>`;

  return `<svg class="wheel" id="wheel" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49.5" fill="#fff" stroke="#5b3550" stroke-width="2"/>${g}</svg>`}

    },4400);
  };
}

const TRACKS=[{id:'easy',name:'Facile',n:6,col:'#4fbf8f',a:'#9ff0c8',gain:4,ico:'🌱'},{id:'normal',name:'Normal',n:7,col:'#4c9fe0',a:'#a8d8ff',gain:6,ico:'⭐'},
  {id:'hard',name:'Difficile',n:8,col:'#e3628d',a:'#ffb8cf',gain:9,ico:'🔥'},{id:'expert',name:'Expert',n:9,col:'#8d5fdf',a:'#d6bcff',gain:13,ico:'👑'},
  {id:'extreme',name:'Extrême',n:9,col:'#e03131',a:'#ff8787',gain:20,ico:'☠️',cands:8},{id:'nightmare',name:'Cauchemar',n:10,col:'#3b2352',a:'#8c5fc4',gain:30,ico:'💀',cands:6}];

// Chaque niveau a une difficulté tirée au hasard (toujours la même pour un numéro donné),
// avec de plus en plus de chances de tomber sur Difficile / Expert au fil des niveaux.
function genClassic(L){
  R=seeded(hashStr('cls#'+L));
  const boss=L%10===0;
  const w=[Math.max(10,45-L*.8),35,Math.min(35,10+L*.6),Math.min(30,3+L*.5),L>=8?Math.min(14,(L-7)*.5):0,L>=20?Math.min(9,(L-19)*.3):0];
  let tot=0;w.forEach(x=>tot+=x);let r=R()*tot,ti=3;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){ti=i;break}}
  if(boss)ti=L<30?4:5;
  const T=TRACKS[ti],nc=T.cands||4,cands=[];
  for(let i=0;i<nc;i++){let p=null;while(!p)p=generate(T.n);NODES=0;solve(T.n,p.g,2);cands.push([NODES,p])}
  R=Math.random;cands.sort((a,b)=>a[0]-b[0]);
  return{T,boss,p:ti>=4?cands[nc-1][1]:cands[Math.min(3,ti+(L>40?1:0))][1]};
}
function startClassic(L){const g=genClassic(L);mode='classic';curTrack=g.T;curL=L;P=g.p;diffName=`Niv. ${L} · ${g.boss?'BOSS ':''}${g.T.name}`;$('newLbl').textContent='Rejouer';showScreen('game');resetGame();
  setTimeout(()=>{const b=$('frame').getBoundingClientRect();floatText(b.left+b.width/2,b.top+b.height/2-20,g.boss?`💀 BOSS · Niveau ${L}`:`Niveau ${L}`,g.boss?'#e03131':'#ff5d8f',34);if(g.boss){sfx.wrong();anim($('frame'),'shake')}
    setTimeout(()=>{floatText(b.left+b.width/2,b.top+b.height/2+20,`${g.T.ico} ${g.T.name} · ${g.T.n}×${g.T.n}`,g.T.col,26)},350)},300)}

function resetGame(){const n=P.n;st=Array.from({length:n},()=>Array(n).fill(0));hearts=3;hist=[];over=false;hints=0;combo=0;lastOk=0;lastTap=null;

function buildBoard(){const n=P.n,g=P.g,pal=activePalette();board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.innerHTML='';
  board.classList.remove('intro');void board.offsetWidth;board.classList.add('intro');const GI=1.6,GX=3.2;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const id=g[r][c],top=r===0||g[r-1][c]!==id,bot=r===n-1||g[r+1][c]!==id,lef=c===0||g[r][c-1]!==id,rig=c===n-1||g[r][c+1]!==id;

    const t=document.createElement('div');t.className='tile';

let xDelay={};
function render(){const n=P.n;let cnt=0;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const s=st[r][c],t=tileEl(r,c),want=s===2?'b':s===1?'x':'';
    if(t.dataset.v!==want){t.dataset.v=want;

      else if(s===1){t.innerHTML=XSVG;const d=xDelay[r+','+c];if(d)t.firstElementChild.style.animationDelay=d+'ms'}else t.innerHTML=''}

/* Contrôles : tap = ✕ on/off · double-tap ou appui long = mascotte · glisser = plein de ✕ */
function tap(r,c){if(over)return;const now=Date.now(),s=st[r][c];
  if(lastTap&&lastTap.r===r&&lastTap.c===c&&now-lastTap.t<330&&lastTap.prev!==2&&s!==2){st[r][c]=lastTap.prev;hist.pop();lastTap=null;placePet(r,c);return}

const MSG_EMPTY=()=>({config:{},victoire:{},motDuJour:{},lettres:[],programmes:[],cadeaux:[],mots:[],trolls:[]});
let MSG=Object.assign(MSG_EMPTY(),GLS.get('msgcache',{}));
const isoDay=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function repoInfo(){const c=GLS.get('repo',null);if(c&&c.owner&&c.repo)return c;const h=location.hostname;
  if(h.endsWith('.github.io'))return{owner:h.split('.')[0],repo:'kawaidoku-messages'};return null}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function fetchRemote(auth){
  const r=repoInfo();if(!r)throw new Error('pas de dépôt');
  const h={Accept:'application/vnd.github+json'};if(auth&&GLS.get('token',''))h.Authorization='Bearer '+GLS.get('token','');
  const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/messages.json?t=${Date.now()}`,{headers:h,cache:'no-store'});
  if(res.status===404)return{data:MSG_EMPTY(),sha:null};
  if(!res.ok)throw new Error('GitHub '+res.status);
  const j=await res.json();return{data:Object.assign(MSG_EMPTY(),JSON.parse(b64d(j.content))),sha:j.sha};
}
async function loadMSG(){
  if(GLS.get('token','')){try{const{data}=await fetchRemote(true);MSG=data;GLS.set('msgcache',MSG)}catch(e){}}
  renderInboxBtn();if(!$('menu').classList.contains('hidden'))checkInbox();if(PROFILE)checkTroll();
}
async function saveMSG(){
  GLS.set('msgcache',MSG);
  const r=repoInfo(),token=GLS.get('token','');
  if(!r||!token)return'local';
  let sha=null;try{const rm=await fetchRemote(true);sha=rm.sha;
    const ids=new Set((MSG.mots||[]).map(m=>m.id));MSG.mots=[...(MSG.mots||[]),...((rm.data.mots||[]).filter(m=>!ids.has(m.id)))];GLS.set('msgcache',MSG)}catch(e){}
  const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/messages.json`,{method:'PUT',
    headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({message:'Kawaidoku : messages mis à jour 💌',content:b64e(JSON.stringify(MSG,null,2)),...(sha?{sha}:{})})});
  if(!res.ok)throw new Error('GitHub '+res.status);return'ok';
}

async function ghFile(path){const r=repoInfo(),t=GLS.get('token','');if(!r||!t)throw new Error('connexion GitHub manquante');
  const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/${path}?t=${Date.now()}`,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t},cache:'no-store'});
  if(res.status===404)return{data:null,sha:null};if(!res.ok)throw new Error('GitHub '+res.status);const j=await res.json();return{data:JSON.parse(b64d(j.content)),sha:j.sha}}
async function ghWrite(path,obj,sha,msg){const r=repoInfo(),t=GLS.get('token','');
  const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/${path}`,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({message:msg,content:b64e(JSON.stringify(obj,null,1)),...(sha?{sha}:{})})});if(!res.ok)throw new Error('GitHub '+res.status)}
async function saveSub(daily){

// Vérifie les nouveautés pendant que le jeu est ouvert (trolls, mots, cadeaux)
setInterval(()=>{if(PROFILE&&document.visibilityState==='visible')loadMSG()},20000);
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('bgpause',document.visibilityState!=='visible');if(PROFILE&&document.visibilityState==='visible')loadMSG()});

/* démarrage */
document.body.classList.toggle('lite',S.lite);
applyLook();applyTod();setWeather();
$('splashPet').innerHTML=pet();
document.querySelectorAll('.sub').forEach(e=>e.textContent=subTxt());
document.querySelectorAll('.ttl').forEach(h=>{if(!h.innerHTML)h.innerHTML=[...'Kawaidoku'].map((ch,i)=>`<span style="animation-delay:${i*.09}s">${ch}</span>`).join('')});
if(!PROFILE){$('splash').classList.add('hidden');showPicker()}
else{let goMenu=false;try{goMenu=!!sessionStorage.getItem('kd-go');sessionStorage.removeItem('kd-go')}catch(e){}
  if(goMenu){renderMenu();showScreen('menu');if(!LS.get('seenRules3',false)){LS.set('seenRules3',true);setTimeout(()=>showRules(true),600)}}}
loadMSG();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic|usercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
